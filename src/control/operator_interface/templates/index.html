<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAADS Operator Control</title>
</head>

<body>
    <h1>SAADS Operator Control</h1>

    <p>Web Operator Interface: ONLINE</p>

    <hr>

    <h2>Mission Control</h2>

    <div>
        <label for="goal-x">Goal X (m):</label>
        <input
            id="goal-x"
            type="number"
            step="0.1"
            value="3.0"
        >
    </div>

    <div>
        <label for="goal-y">Goal Y (m):</label>
        <input
            id="goal-y"
            type="number"
            step="0.1"
            value="0.0"
        >
    </div>

    <br>

    <button id="send-goal">
        Send Goal
    </button>

    <button id="cancel-goal">
        Cancel Goal
    </button>

    <hr>

    <h2>Navigation Status</h2>

    <p>
        Status:
        <span id="navigation-status">
            Waiting for command...
        </span>
    </p>

    <p>
        Distance to Goal:
        <span id="distance-to-goal">--</span> m
    </p>

    <p>
        Speed:
        <span id="navigation-speed">--</span> m/s
    </p>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
