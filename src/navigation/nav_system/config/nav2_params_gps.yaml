# SAADS Nav2 - OUTDOOR GPS WAYPOINT PROFILE
#
# Runs alongside Trevor's nav2_params.yaml, which stays as the map-based
# CIL profile. Neither file touches the other.
#
# ---------------------------------------------------------------------------
# DIFFERENCES FROM THE CIL PROFILE, AND WHY
# ---------------------------------------------------------------------------
#   no map_server / no static_layer   nothing to load, no prior map exists
#   global costmap rolling            follows the robot instead of a map
#   lidar layers COMMENTED OUT        see below - deliberate for first runs
#   spin + backup recoveries added    CIL profile could only "wait" if stuck
#   bt_navigator parameterised        it had none; odom_topic defaulted wrong
#   goal tolerance 1.0 m              GPS is 3 m accurate; 0.25 m chases noise
#
# ---------------------------------------------------------------------------
# WHY THE LIDAR IS OFF
# ---------------------------------------------------------------------------
# The first autonomous run should test ONE thing: does GPS goal -> plan ->
# cmd_vel -> motion -> arrival connect end to end. Empty costmaps in an open
# field means no obstacle can be blamed for a failure.
#
# Every voxel_layer block below is written and commented out. To enable
# (milestone M4), uncomment them and change "plugins" to include
# "voxel_layer". Set min_obstacle_height from a real cloud first, or the
# costmap fills with ground returns and the planner refuses to move.
# ---------------------------------------------------------------------------

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    # Defaults to /odom, which does not exist on this robot.
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/local

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Looser than the CIL values: outdoors on loose ground the robot can
      # legitimately make slow progress without being stuck.
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Matched to GPS accuracy. Demanding 0.25 m from a 3 m sensor means
      # the robot circles the goal forever.
      xy_goal_tolerance: 1.0
      # Heading on arrival is irrelevant for a delivery waypoint.
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Keep the first runs slow. Raise once it behaves.
      desired_linear_vel: 0.5
      lookahead_dist: 4.0
      min_lookahead_dist: 2.0
      max_lookahead_dist: 6.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.2

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.57
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0


planner_server:
  ros__parameters:
    use_sim_time: false
    # 5 Hz over a 50x50 m costmap is heavy; 1 Hz is plenty for outdoor
    # waypoint navigation.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Keeping Trevor's documented choice.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 1.0
      downsample_costmap: false
      allow_unknown: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0

      # MUST be odom. In map, every GPS correction teleports the costmap
      # under the controller mid-drive.
      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05

      # PLACEHOLDER. Hull measures roughly 0.96 x 0.55 m, so 0.55 is a
      # conservative circumscribed radius. Replace with a measured
      # footprint polygon before obstacle work.
      robot_radius: 0.55

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        combination_method: 1
        observation_sources: lidar
        lidar:
          topic: /unilidar/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_min_range: 0.3
          obstacle_max_range: 15.0
          raytrace_min_range: 0.3
          raytrace_max_range: 18.0
          # MEASURE THIS. Ground returns below it are discarded. Too low
          # and the costmap fills with phantom obstacles on flat ground.
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.75

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      # The key no-map setting. Without rolling_window and with no map
      # loaded, this costmap would be empty and fixed at the origin - the
      # planner would refuse every goal more than a few metres away.
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      track_unknown_space: false

      robot_radius: 0.55

      # No static_layer: there is no map.
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 12
        max_obstacle_height: 1.5
        mark_threshold: 0
        combination_method: 1
        observation_sources: lidar
        lidar:
          topic: /unilidar/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_min_range: 0.3
          obstacle_max_range: 20.0
          raytrace_min_range: 0.3
          raytrace_max_range: 25.0
          min_obstacle_height: 0.15
          max_obstacle_height: 1.5
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.5
        inflation_radius: 1.0

      always_send_full_costmap: true


behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0

    # The CIL profile had only "wait" - when stuck, the robot could do
    # nothing but sit there. These give it a way out.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    # Recoveries are short local manoeuvres and run in odom, so a GPS
    # correction mid-recovery does not disturb them.
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0


waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2000
