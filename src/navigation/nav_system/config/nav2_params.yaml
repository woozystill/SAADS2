amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odometry/local

    controller_plugins: ["FollowPath"]

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Conservative CIL-only values.
      # These are not final SAADS vehicle dynamics.
      desired_linear_vel: 0.30
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.50
      transform_tolerance: 0.20

      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      allow_reversing: false

bt_navigator:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.1

      # CIL-only placeholder.
      # Replace with verified SAADS dimensions before vehicle testing.
      robot_radius: 0.30

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.6
        observation_sources: unilidar

        unilidar:
          topic: /unilidar/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.1
          raytrace_max_range: 5.0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.6

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.1

      # CIL-only placeholder.
      # Replace with verified SAADS dimensions before vehicle testing.
      robot_radius: 0.30

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: unilidar

        unilidar:
          topic: /unilidar/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.1
          raytrace_max_range: 5.0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.6

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2

    behavior_plugins: ["wait"]

    wait:
      plugin: "nav2_behaviors/Wait"
